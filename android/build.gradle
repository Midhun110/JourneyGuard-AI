allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Workaround for Gradle 8.4 issue with processDebugMainManifest
// Disables state tracking for the manifest processing task
gradle.taskGraph.whenReady { taskGraph ->
    taskGraph.allTasks.each { task ->
        if (task.name == "processDebugMainManifest" || task.name == "processReleaseMainManifest") {
            task.doNotTrackState("disable manifest processing tracking")
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
