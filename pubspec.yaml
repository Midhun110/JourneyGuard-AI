name: journey_guard_ai
description: JourneyGuard AI - AI-powered predictive road accessibility and weather-risk navigation app for Smart India Hackathon 2026.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Maps & Routing
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # HTTP
  http: ^1.2.0

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Image picker
  image_picker: ^1.1.2

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # State Management
  provider: ^6.1.2

  # Date/Time
  intl: ^0.19.0

  # Permissions
  permission_handler: ^11.3.1

  # Icons
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

  # Supabase (PostgreSQL + PostGIS, Auth & Storage)
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
